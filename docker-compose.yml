services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # URL pública del backend (motor-scoring-crediticio). Ejemplo local:
        # http://host.docker.internal:8080 (así el contenedor alcanza un backend
        # corriendo en el host, fuera de Docker).
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
    restart: unless-stopped
