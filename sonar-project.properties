# src/routeTree.gen.ts lo regenera el plugin de TanStack Router en cada
# build/dev a partir de src/routes/**; su cabecera (`/* eslint-disable */`
# sin reglas, `// @ts-nocheck`) la pone el generador, no nosotros, así que
# editarla a mano no sirve (se sobrescribe en el siguiente build). Se
# excluye del análisis en vez de "arreglar" código que no controlamos.
sonar.exclusions=src/routeTree.gen.ts,dist/**,.output/**,.vinxi/**
