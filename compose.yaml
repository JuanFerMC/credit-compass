services:
  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_AUTH_BASE_URL: ${VITE_AUTH_BASE_URL:-http://localhost:8081}
        VITE_SCORING_SENDS_TOKEN: ${VITE_SCORING_SENDS_TOKEN:-false}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    restart: unless-stopped